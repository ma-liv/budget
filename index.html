function pickByDay(list) { return list[new Date().getDate() % list.length]; }
function startOfWeek(d = new Date()) {
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7;
  date.setDate(date.getDate() - day);
  date.setHours(0, 0, 0, 0);
  return date;
}
function startOfMonth(d = new Date()) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function inRange(dateStr, from) { if (!dateStr) return false; return new Date(dateStr) >= from; }
function monthsUntil(dateStr) {
  if (!dateStr) return null;
  const target = new Date(dateStr);
  const now = new Date();
  let months = (target.getFullYear() - now.getFullYear()) * 12 + (target.getMonth() - now.getMonth());
  if (target.getDate() < now.getDate()) months -= 1;
  return Math.max(1, months);
}
function objectiveLabel(profile) {
  if (!profile) return null;
  if (profile.motivation === "projet") {
    const pt = PROJECT_TYPES.find((p) => p.id === profile.projectType);
    return `Financer ton projet${pt ? " : " + pt.label.toLowerCase() : ""}`;
  }
  const m = MOTIVATIONS.find((x) => x.id === profile.motivation);
  return m ? m.label : null;
}
function objectiveEmoji(profile) {
  const m = MOTIVATIONS.find((x) => x.id === profile?.motivation);
  return m ? m.emoji : "🧭";
}

function loadCache() {
  try {
    const raw = localStorage.getItem(LOCAL_CACHE_KEY);
    if (raw) return { ...DEFAULT_DATA, ...JSON.parse(raw) };
  } catch (e) {}
  return null;
}
function saveCache(data) {
  try { localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(data)); } catch (e) {}
}

/* ---------- Auth ---------- */

function Root() {
  const [session, setSession] = useState(undefined); // undefined = loading, null = logged out
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);

  if (session === undefined) {
    return (
      <div style={{ backgroundColor: BG, color: TEXT, minHeight: "100vh", fontFamily: "'IBM Plex Sans', sans-serif" }} className="flex items-center justify-center">
        <p className="text-sm opacity-70">Connexion…</p>
      </div>
    );
  }
  if (!session) return <AuthScreen />;
  return <App key={session.user.id} session={session} />;
}

function AuthScreen() {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async () => {
    setError(""); setInfo(""); setLoading(true);
    try {
      if (mode === "signup") {
        const { error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        setInfo("Compte créé. Si une confirmation par email est demandée, vérifie ta boîte mail, puis connecte-toi.");
        setMode("signin");
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (e) {
      setError(e.message || "Une erreur est survenue.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{ backgroundColor: BG, color: TEXT, minHeight: "100vh", fontFamily: "'IBM Plex Sans', sans-serif" }} className="flex flex-col justify-center px-6">
      <p className="text-xs tracking-[0.2em] uppercase mb-2 text-center" style={{ color: ROSE }}>Mon budget</p>
      <h1 style={{ fontFamily: "'Fraunces', serif" }} className="text-3xl text-center mb-8">
        {mode === "signup" ? "Créer ton compte" : "Content de te revoir"}
      </h1>
      <div className="max-w-sm w-full mx-auto">
        <Field label="Email">
          <input type="email" className={inputClass} style={inputStyle} value={email} onChange={(e) => setEmail(e.target.value)} placeholder="toi@exemple.com" />
        </Field>
        <Field label="Mot de passe">
          <input type="password" className={inputClass} style={inputStyle} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" />
        </Field>
        {error && <p className="text-xs mb-3" style={{ color: DANGER }}>{error}</p>}
        {info && <p className="text-xs mb-3" style={{ color: SAGE }}>{info}</p>}
        <button disabled={loading || !email || !password} onClick={submit}
          className="w-full py-3 rounded-lg font-medium text-sm disabled:opacity-40 mb-3" style={{ backgroundColor: ROSE, color: "#FFFFFF" }}>
          {loading ? "…" : mode === "signup" ? "Créer mon compte" : "Se connecter"}
        </button>
        <button onClick={() => { setMode(mode === "signup" ? "signin" : "signup"); setError(""); setInfo(""); }}
          className="w-full text-center text-xs" style={{ color: TEXT_MUTED }}>
          {mode === "signup" ? "J'ai déjà un compte" : "Pas encore de compte ? En créer un"}
        </button>
      </div>
    </div>
  );
}

/* ---------- Main app ---------- */

function App({ session }) {
  const [data, setData] = useState(() => loadCache() || DEFAULT_DATA);
  const [dataReady, setDataReady] = useState(false);
  const [tab, setTab] = useState("dashboard");
  const [period, setPeriod] = useState("mois");
  const [showExpenseForm, setShowExpenseForm] = useState(false);
  const [showGoalForm, setShowGoalForm] = useState(false);
  const [showIncomeEdit, setShowIncomeEdit] = useState(false);
  const [chargeEditor, setChargeEditor] = useState(null);
  const [editProfile, setEditProfile] = useState(false);
  const [error, setError] = useState("");
  const fileInputRef = useRef(null);

  useEffect(() => {
    (async () => {
      const { data: row, error } = await sb.from("budget_data").select("data").eq("user_id", session.user.id).maybeSingle();
      if (!error && row && row.data) {
        setData({ ...DEFAULT_DATA, ...row.data });
        saveCache(row.data);
      }
      setDataReady(true);
    })();
  }, [session.user.id]);

  const persist = async (next) => {
    setData(next);
    saveCache(next);
    const { error } = await sb.from("budget_data").upsert({ user_id: session.user.id, data: next, updated_at: new Date().toISOString() });
    setError(error ? "Sauvegardé sur cet appareil, mais pas encore synchronisé (vérifie ta connexion)." : "");
  };

  const logout = () => sb.auth.signOut();

  const totalCharges = useMemo(() => data.charges.reduce((s, c) => s + Number(c.amount || 0), 0), [data.charges]);
  const variableMonthExpenses = useMemo(() => data.expenses.filter((e) => inRange(e.date, startOfMonth())), [data.expenses]);
  const variableMonthTotal = useMemo(() => variableMonthExpenses.reduce((s, e) => s + Number(e.amount || 0), 0), [variableMonthExpenses]);
  const variablePeriodExpenses = useMemo(() => {
    const from = period === "semaine" ? startOfWeek() : startOfMonth();
    return data.expenses.filter((e) => inRange(e.date, from));
  }, [data.expenses, period]);
  const variablePeriodTotal = useMemo(() => variablePeriodExpenses.reduce((s, e) => s + Number(e.amount || 0), 0), [variablePeriodExpenses]);
  const remaining = data.income - totalCharges - variableMonthTotal;
  const byCategoryChart = useMemo(() => {
    const map = {};
    CATEGORIES.forEach((c) => (map[c.id] = 0));
    if (period === "mois") data.charges.forEach((c) => (map[c.category] = (map[c.category] || 0) + Number(c.amount || 0)));
    variablePeriodExpenses.forEach((e) => (map[e.category] = (map[e.category] || 0) + Number(e.amount || 0)));
    return map;
  }, [data.charges, variablePeriodExpenses, period]);

  const addExpense = (expense) => { persist({ ...data, expenses: [...data.expenses, { ...expense, id: uid() }] }); setShowExpenseForm(false); };
  const deleteExpense = (id) => persist({ ...data, expenses: data.expenses.filter((e) => e.id !== id) });
  const saveCharge = (charge) => {
    if (charge.id) persist({ ...data, charges: data.charges.map((c) => (c.id === charge.id ? charge : c)) });
    else persist({ ...data, charges: [...data.charges, { ...charge, id: uid() }] });
    setChargeEditor(null);
  };
  const deleteCharge = (id) => persist({ ...data, charges: data.charges.filter((c) => c.id !== id) });
  const addGoal = (goal) => { persist({ ...data, goals: [...data.goals, { ...goal, id: uid(), current: Number(goal.current) || 0 }] }); setShowGoalForm(false); };
  const deleteGoal = (id) => persist({ ...data, goals: data.goals.filter((g) => g.id !== id) });
  const contribute = (id, amount) => persist({ ...data, goals: data.goals.map((g) => (g.id === id ? { ...g, current: Math.max(0, Number(g.current) + amount) } : g)) });
  const updateIncome = (val) => { persist({ ...data, income: Number(val) || 0 }); setShowIncomeEdit(false); };
  const finishOnboarding = (profile) => persist({ ...data, profile, onboarded: true });
  const saveProfile = (profile) => { persist({ ...data, profile }); setEditProfile(false); };

  const exportData = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `mon-budget-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  const triggerImport = () => fileInputRef.current && fileInputRef.current.click();
  const handleImportFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (window.confirm("Remplacer toutes tes données actuelles par cette sauvegarde ?")) persist({ ...DEFAULT_DATA, ...parsed });
      } catch (err) {
        setError("Ce fichier n'est pas une sauvegarde valide.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  if (!dataReady) {
    return (
      <div style={{ backgroundColor: BG, color: TEXT, minHeight: "100vh", fontFamily: "'IBM Plex Sans', sans-serif" }} className="flex items-center justify-center">
        <p className="text-sm opacity-70">Chargement de tes données…</p>
      </div>
    );
  }

  if (!data.onboarded) return <Onboarding onComplete={finishOnboarding} />;

  const monthLabel = new Date().toLocaleDateString("fr-FR", { month: "long", year: "numeric" });

  return (
    <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", backgroundColor: BG, color: TEXT, minHeight: "100vh", paddingBottom: "calc(84px + env(safe-area-inset-bottom))" }}>
      {editProfile && (
        <div style={{ position: "fixed", inset: 0, zIndex: 50, backgroundColor: BG }}>
          <Onboarding initial={data.profile} onComplete={saveProfile} onClose={() => setEditProfile(false)} />
        </div>
      )}

      <header className="px-5 pb-5" style={{ borderBottom: `1px solid ${BORDER}`, paddingTop: "calc(2rem + env(safe-area-inset-top))" }}>
        <div className="flex items-start justify-between">
          <div>
            <p className="text-xs tracking-[0.2em] uppercase" style={{ color: ROSE }}>Bonjour {USER_NAME}</p>
            <h1 style={{ fontFamily: "'Fraunces', serif" }} className="text-3xl mt-1 font-semibold">Mon budget</h1>
            <p style={{ fontFamily: "'IBM Plex Mono', monospace", color: TEXT_MUTED }} className="text-[11px] mt-1 capitalize">{monthLabel}</p>
          </div>
          <button onClick={logout} className="text-[10px] mt-1 underline shrink-0" style={{ color: TEXT_MUTED }}>Déconnexion</button>
        </div>
      </header>

      {error && (
        <div className="mx-5 mt-4 text-xs px-3 py-2 rounded" style={{ backgroundColor: DANGER + "1A", border: `1px solid ${DANGER}`, color: TEXT }}>{error}</div>
      )}

      <main className="px-5 mt-6">
        {tab === "dashboard" && (
          <Dashboard data={data} totalCharges={totalCharges} variableMonthTotal={variableMonthTotal} remaining={remaining}
            byCategoryChart={byCategoryChart} period={period} setPeriod={setPeriod}
            onEditIncome={() => setShowIncomeEdit(true)} onGoToCharges={() => setTab("charges")} onEditProfile={() => setEditProfile(true)} />
        )}
        {tab === "charges" && (
          <Charges charges={data.charges} totalCharges={totalCharges} onAdd={() => setChargeEditor(true)} onEdit={(c) => setChargeEditor(c)} onDelete={deleteCharge} />
        )}
        {tab === "depenses" && (
          <Expenses period={period} setPeriod={setPeriod} periodExpenses={variablePeriodExpenses} periodTotal={variablePeriodTotal} onDelete={deleteExpense} onAdd={() => setShowExpenseForm(true)} />
        )}
        {tab === "epargne" && <Savings goals={data.goals} onAdd={() => setShowGoalForm(true)} onDelete={deleteGoal} onContribute={contribute} />}
        {tab === "parcours" && (
          <Parcours data={data} onEditProfile={() => setEditProfile(true)} onExport={exportData} onImport={triggerImport} />
        )}
      </main>
      <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={handleImportFile} />

      <nav style={{ position: "fixed", left: 0, right: 0, bottom: 0, backgroundColor: SURFACE, borderTop: `1px solid ${BORDER}`, paddingBottom: "env(safe-area-inset-bottom)" }} className="flex">
        <TabButton active={tab === "dashboard"} onClick={() => setTab("dashboard")} emoji="📊" label="Aperçu" />
        <TabButton active={tab === "charges"} onClick={() => setTab("charges")} emoji="📋" label="Charges" />
        <TabButton active={tab === "depenses"} onClick={() => setTab("depenses")} emoji="🧾" label="Dépenses" />
        <TabButton active={tab === "epargne"} onClick={() => setTab("epargne")} emoji="🐷" label="Épargne" />
        <TabButton active={tab === "parcours"} onClick={() => setTab("parcours")} emoji="🗺️" label="Parcours" />
      </nav>

      {showExpenseForm && <ExpenseForm onClose={() => setShowExpenseForm(false)} onSubmit={addExpense} />}
      {chargeEditor && <ChargeForm initial={typeof chargeEditor === "object" ? chargeEditor : null} onClose={() => setChargeEditor(null)} onSubmit={saveCharge} />}
      {showGoalForm && <GoalForm onClose={() => setShowGoalForm(false)} onSubmit={addGoal} />}
      {showIncomeEdit && <IncomeForm initial={data.income} onClose={() => setShowIncomeEdit(false)} onSubmit={updateIncome} />}
    </div>
  );
}

function OptionCard({ selected, onClick, label, emoji }) {
  return (
    <button onClick={onClick} className="w-full flex items-center gap-3 rounded-xl border px-4 py-3.5 text-left transition-colors"
      style={{ borderColor: selected ? ROSE : BORDER, backgroundColor: selected ? ROSE + "14" : SURFACE }}>
      {emoji && <div className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ backgroundColor: (selected ? ROSE : TEXT_MUTED) + "20", fontSize: 16 }}>{emoji}</div>}
      <span className="text-sm flex-1">{label}</span>
      <div className="w-4 h-4 rounded-full border shrink-0" style={{ borderColor: selected ? ROSE : BORDER, backgroundColor: selected ? ROSE : "transparent" }} />
    </button>
  );
}

function Onboarding({ initial, onComplete, onClose }) {
  const [answers, setAnswers] = useState(initial || { motivation: null, projectType: null, relationship: null, frequency: null });
  const includesProject = answers.motivation === "projet";
  const stepsOrder = ["motivation", ...(includesProject ? ["projectType"] : []), "relationship", "frequency", "summary"];
  const [stepIndex, setStepIndex] = useState(0);
  const current = stepsOrder[Math.min(stepIndex, stepsOrder.length - 1)];
  const set = (key, val) => setAnswers((a) => ({ ...a, [key]: val }));
  const canNext =
    (current === "motivation" && answers.motivation) ||
    (current === "projectType" && answers.projectType) ||
    (current === "relationship" && answers.relationship) ||
    (current === "frequency" && answers.frequency) ||
    current === "summary";
  const next = () => setStepIndex((i) => Math.min(i + 1, stepsOrder.length - 1));
  const back = () => setStepIndex((i) => Math.max(i - 1, 0));
  const objLabel = objectiveLabel(answers);
  const objEmoji = objectiveEmoji(answers);

  return (
    <div style={{ backgroundColor: BG, color: TEXT, minHeight: "100vh", fontFamily: "'IBM Plex Sans', sans-serif" }} className="flex flex-col">
      <div className="px-5 pb-4 flex items-center justify-between" style={{ paddingTop: "calc(2rem + env(safe-area-inset-top))" }}>
        <div className="flex gap-1.5">
          {stepsOrder.map((s, i) => <div key={s} className="h-1.5 rounded-full transition-all" style={{ width: i === stepIndex ? 24 : 8, backgroundColor: i <= stepIndex ? ROSE : BORDER }} />)}
        </div>
        {onClose && <button onClick={onClose} style={{ color: TEXT_MUTED, fontSize: 20 }}>✕</button>}
      </div>
      <div className="px-5 flex-1 overflow-y-auto">
        <p className="text-xs tracking-[0.2em] uppercase mb-2" style={{ color: ROSE }}>{onClose ? "Ton profil" : "Avant de commencer"}</p>
        {current === "motivation" && (
          <>
            <h2 style={{ fontFamily: "'Fraunces', serif" }} className="text-2xl mb-5">Qu'est-ce qui t'amène ici aujourd'hui ?</h2>
            <div className="space-y-2.5">{MOTIVATIONS.map((m) => <OptionCard key={m.id} emoji={m.emoji} label={m.label} selected={answers.motivation === m.id} onClick={() => set("motivation", m.id)} />)}</div>
          </>
        )}
        {current === "projectType" && (
          <>
            <h2 style={{ fontFamily: "'Fraunces', serif" }} className="text-2xl mb-5">Quel type de projet ?</h2>
            <div className="space-y-2.5">{PROJECT_TYPES.map((p) => <OptionCard key={p.id} label={p.label} selected={answers.projectType === p.id} onClick={() => set("projectType", p.id)} />)}</div>
          </>
        )}
        {current === "relationship" && (
          <>
            <h2 style={{ fontFamily: "'Fraunces', serif" }} className="text-2xl mb-5">Comment décrirais-tu ta relation à l'argent aujourd'hui ?</h2>
            <div className="space-y-2.5">{RELATIONSHIPS.map((r) => <OptionCard key={r.id} label={r.label} selected={answers.relationship === r.id} onClick={() => set("relationship", r.id)} />)}</div>
          </>
        )}
        {current === "frequency" && (
          <>
            <h2 style={{ fontFamily: "'Fraunces', serif" }} className="text-2xl mb-5">À quelle fréquence veux-tu suivre ton budget ?</h2>
            <div className="space-y-2.5">{FREQUENCIES.map((f) => <OptionCard key={f.id} label={f.label} selected={answers.frequency === f.id} onClick={() => set("frequency", f.id)} />)}</div>
          </>
        )}
        {current === "summary" && (
          <>
            <h2 style={{ fontFamily: "'Fraunces', serif" }} className="text-2xl mb-5">Ton profil budget</h2>
            <div className="rounded-xl border p-5 mb-4" style={{ backgroundColor: SURFACE, borderColor: BORDER }}>
              <div className="flex items-center gap-3 mb-4">
                <div className="w-10 h-10 rounded-full flex items-center justify-center" style={{ backgroundColor: ROSE + "20", fontSize: 18 }}>{objEmoji}</div>
                <div>
                  <p className="text-[11px] uppercase tracking-[0.1em]" style={{ color: TEXT_MUTED }}>Ton objectif général</p>
                  <p className="text-sm font-medium">{objLabel}</p>
                </div>
              </div>
              <div className="space-y-2 text-xs pt-3 border-t" style={{ borderColor: BORDER, color: TEXT_MUTED }}>
                <p>Relation à l'argent : <span style={{ color: TEXT }}>{RELATIONSHIPS.find((r) => r.id === answers.relationship)?.label}</span></p>
                <p>Suivi souhaité : <span style={{ color: TEXT }}>{FREQUENCIES.find((f) => f.id === answers.frequency)?.label}</span></p>
              </div>
            </div>
            <p className="text-xs leading-relaxed" style={{ color: TEXT_MUTED }}>On garde ce cap comme fil rouge — tu pourras le modifier à tout moment depuis l'onglet Parcours.</p>
          </>
        )}
      </div>
      <div className="px-5 py-5 flex gap-3" style={{ paddingBottom: "calc(1.25rem + env(safe-area-inset-bottom))" }}>
        {stepIndex > 0 && <button onClick={back} className="px-4 py-3 rounded-lg border" style={{ borderColor: BORDER, color: TEXT_MUTED }}>‹</button>}
        <button disabled={!canNext} onClick={() => (current === "summary" ? onComplete(answers) : next())}
          className="flex-1 py-3 rounded-lg font-medium text-sm disabled:opacity-40" style={{ backgroundColor: ROSE, color: "#FFFFFF" }}>
          {current === "summary" ? "Commencer à gérer mon budget" : "Continuer →"}
        </button>
      </div>
    </div>
  );
}

function TabButton({ active, onClick, emoji, label }) {
  return (
    <button onClick={onClick} className="flex-1 flex flex-col items-center gap-1 py-3" style={{ color: active ? ROSE : TEXT_MUTED }}>
      <span style={{ fontSize: 18, opacity: active ? 1 : 0.7 }}>{emoji}</span>
      <span className="text-[9.5px] tracking-wide text-center leading-none">{label}</span>
    </button>
  );
}

function PeriodToggle({ period, setPeriod }) {
  return (
    <div className="flex rounded-full p-1 text-xs" style={{ backgroundColor: SURFACE_ALT, border: `1px solid ${BORDER}` }}>
      {[{ id: "semaine", label: "Semaine" }, { id: "mois", label: "Mois" }].map((p) => (
        <button key={p.id} onClick={() => setPeriod(p.id)} className="px-3 py-1.5 rounded-full"
          style={{ backgroundColor: period === p.id ? ROSE : "transparent", color: period === p.id ? "#FFFFFF" : TEXT_MUTED, fontWeight: period === p.id ? 600 : 400 }}>{p.label}</button>
      ))}
    </div>
  );
}

function Card({ children, className = "", style = {} }) {
  return <div className={`rounded-xl border p-5 ${className}`} style={{ backgroundColor: SURFACE, borderColor: BORDER, ...style }}>{children}</div>;
}

function ObjectiveBanner({ profile, onEdit }) {
  if (!profile) return null;
  return (
    <button onClick={onEdit} className="w-full flex items-center gap-3 rounded-xl px-4 py-3 text-left" style={{ backgroundColor: SURFACE_ALT, border: `1px solid ${BORDER}` }}>
      <div className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ backgroundColor: ROSE + "20", fontSize: 16 }}>{objectiveEmoji(profile)}</div>
      <div className="flex-1 min-w-0">
        <p className="text-[10px] uppercase tracking-[0.1em]" style={{ color: TEXT_MUTED }}>Ton objectif</p>
        <p className="text-sm truncate">{objectiveLabel(profile)}</p>
      </div>
      <span style={{ color: TEXT_MUTED, fontSize: 13 }}>✏️</span>
    </button>
  );
}

function Dashboard({ data, totalCharges, variableMonthTotal, remaining, byCategoryChart, period, setPeriod, onEditIncome, onGoToCharges, onEditProfile }) {
  const maxCat = Math.max(1, ...Object.values(byCategoryChart));
  const activeCats = CATEGORIES.filter((c) => (byCategoryChart[c.id] || 0) > 0);
  const disponible = data.income - totalCharges;
  return (
    <div className="space-y-6">
      <ObjectiveBanner profile={data.profile} onEdit={onEditProfile} />
      <Card>
        <button onClick={onEditIncome} className="text-left block">
          <p className="text-[11px] uppercase tracking-[0.15em]" style={{ color: ROSE }}>Revenu mensuel</p>
          <p style={{ fontFamily: "'IBM Plex Mono', monospace" }} className="text-2xl mt-1">{fmt(data.income)} €</p>
        </button>
        <div className="mt-5 grid grid-cols-3 gap-3 pt-4 border-t" style={{ borderColor: BORDER }}>
          <button onClick={onGoToCharges} className="text-left">
            <p className="text-[10px] uppercase tracking-[0.1em]" style={{ color: TEXT_MUTED }}>Charges fixes</p>
            <p style={{ fontFamily: "'IBM Plex Mono', monospace" }} className="text-sm mt-0.5">{fmt(totalCharges)} €</p>
          </button>
          <div>
            <p className="text-[10px] uppercase tracking-[0.1em]" style={{ color: TEXT_MUTED }}>Disponible</p>
            <p style={{ fontFamily: "'IBM Plex Mono', monospace" }} className="text-sm mt-0.5">{fmt(disponible)} €</p>
          </div>
          <div>
            <p className="text-[10px] uppercase tracking-[0.1em]" style={{ color: TEXT_MUTED }}>Il te reste</p>
            <p style={{ fontFamily: "'IBM Plex Mono', monospace", color: remaining >= 0 ? SAGE : DANGER }} className="text-sm mt-0.5 font-medium">{fmt(remaining)} €</p>
          </div>
        </div>
        <p className="text-[11px] mt-3" style={{ color: TEXT_MUTED }}>Dépenses variables du mois : {fmt(variableMonthTotal)} €</p>
      </Card>
      <div>
        <div className="flex items-center justify-between mb-3">
          <p className="text-[11px] uppercase tracking-[0.15em]" style={{ color: ROSE }}>Répartition {period === "semaine" ? "(dépenses variables, semaine)" : "(charges + variables, mois)"}</p>
        </div>
        <div className="flex justify-end mb-3"><PeriodToggle period={period} setPeriod={setPeriod} /></div>
        {activeCats.length === 0 ? <EmptyState text="Rien à afficher pour cette période." /> : (
          <Card className="space-y-3">
            {activeCats.map((c) => {
              const val = byCategoryChart[c.id] || 0;
              const pct = Math.round((val / maxCat) * 100);
              return (
                <div key={c.id} className="flex items-center gap-3">
                  <span style={{ fontSize: 15 }} className="shrink-0">{c.emoji}</span>
                  <span className="text-xs w-24 shrink-0 truncate">{c.label}</span>
                  <div className="flex-1 h-2 rounded-full overflow-hidden" style={{ backgroundColor: BG }}><div className="h-full rounded-full transition-all" style={{ width: `${pct}%`, backgroundColor: c.color }} /></div>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace" }} className="text-xs w-16 text-right">{fmt(val)} €</span>
                </div>
              );
            })}
          </Card>
        )}
      </div>
      {data.goals.length > 0 && (
        <div>
          <p className="text-[11px] uppercase tracking-[0.15em] mb-3" style={{ color: ROSE }}>Objectifs en cours</p>
          <div className="space-y-2">
            {data.goals.slice(0, 3).map((g) => {
              const pct = Math.min(100, Math.round((g.current / g.target) * 100));
              return (
                <div key={g.id} className="flex items-center justify-between text-xs rounded-lg px-3 py-2 border" style={{ backgroundColor: SURFACE, borderColor: BORDER }}>
                  <span>{g.name}</span><span style={{ fontFamily: "'IBM Plex Mono', monospace", color: ROSE }}>{pct}%</span>
                </div>
              );
            })}
          </div>
        </div>
      )}
      <TipCard />
    </div>
  );
}

function TipCard() {
  const tip = pickByDay(TIPS);
  return (
    <div className="rounded-xl p-4 flex gap-3" style={{ backgroundColor: SURFACE_ALT, border: `1px solid ${BORDER}` }}>
      <span style={{ fontSize: 18 }} className="shrink-0">💡</span>
      <div>
        <p className="text-[11px] uppercase tracking-[0.15em] mb-1" style={{ color: GOLD }}>Conseil du jour</p>
        <p className="text-xs leading-relaxed">{tip}</p>
      </div>
    </div>
  );
}

function Charges({ charges, totalCharges, onAdd, onEdit, onDelete }) {
  const sorted = [...charges].sort((a, b) => Number(b.amount) - Number(a.amount));
  return (
    <div>
      <div className="flex items-center justify-between mb-1">
        <p className="text-[11px] uppercase tracking-[0.15em]" style={{ color: ROSE }}>{charges.length} charge{charges.length > 1 ? "s" : ""} fixe{charges.length > 1 ? "s" : ""}</p>
        <button onClick={onAdd} className="flex items-center gap-1 text-xs px-3 py-1.5 rounded-full font-medium" style={{ backgroundColor: ROSE, color: "#FFFFFF" }}>+ Ajouter</button>
      </div>
      <p style={{ fontFamily: "'IBM Plex Mono', monospace" }} className="text-lg mb-4">{fmt(totalCharges)} € <span className="text-xs font-normal" style={{ color: TEXT_MUTED }}>/ mois</span></p>
      {sorted.length === 0 ? <EmptyState text="Aucune charge fixe définie. Ajoute ton loyer, tes abonnements, ton assurance… pour prévoir ton budget chaque mois, sans avoir à tout ressaisir." /> : (
        <div className="space-y-2">
          {sorted.map((c) => {
            const info = catInfo(c.category);
            return (
              <div key={c.id} className="flex items-center gap-3 rounded-lg px-3 py-3 border" style={{ backgroundColor: SURFACE, borderColor: BORDER }}>
                <button onClick={() => onEdit(c)} className="flex items-center gap-3 flex-1 min-w-0 text-left">
                  <div className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ backgroundColor: info.color + "26", fontSize: 15 }}>{info.emoji}</div>
                  <div className="flex-1 min-w-0"><p className="text-sm truncate">{c.name || info.label}</p><p className="text-[11px]" style={{ color: TEXT_MUTED }}>{info.label}</p></div>
                </button>
                <p style={{ fontFamily: "'IBM Plex Mono', monospace" }} className="text-sm shrink-0">{fmt(c.amount)} €</p>
                <button onClick={() => onEdit(c)} style={{ color: TEXT_MUTED, fontSize: 13 }} className="shrink-0">✏️</button>
                <button onClick={() => onDelete(c.id)} style={{ color: TEXT_MUTED, fontSize: 14 }} className="shrink-0">🗑️</button>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Expenses({ period, setPeriod, periodExpenses, periodTotal, onDelete, onAdd }) {
  const sorted = [...periodExpenses].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <PeriodToggle period={period} setPeriod={setPeriod} />
        <button onClick={onAdd} className="flex items-center gap-1 text-xs px-3 py-1.5 rounded-full font-medium" style={{ backgroundColor: ROSE, color: "#FFFFFF" }}>+ Ajouter</button>
      </div>
      <p className="text-[11px] uppercase tracking-[0.15em] mb-1" style={{ color: ROSE }}>Dépenses variables · {period === "semaine" ? "cette semaine" : "ce mois-ci"}</p>
      <p style={{ fontFamily: "'IBM Plex Mono', monospace" }} className="text-lg mb-4">{fmt(periodTotal)} €</p>
      {sorted.length === 0 ? <EmptyState text="Aucune dépense variable pour cette période. Les charges fixes (loyer, abonnements…) se gèrent dans l'onglet Charges." /> : (
        <div className="space-y-2">
          {sorted.map((e) => {
            const c = catInfo(e.category);
            return (
              <div key={e.id} className="flex items-center gap-3 rounded-lg px-3 py-3 border" style={{ backgroundColor: SURFACE, borderColor: BORDER }}>
                <div className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ backgroundColor: c.color + "26", fontSize: 15 }}>{c.emoji}</div>
                <div className="flex-1 min-w-0"><p className="text-sm truncate">{e.name || c.label}</p><p className="text-[11px]" style={{ color: TEXT_MUTED }}>{c.label}{e.date ? ` · ${e.date}` : ""}</p></div>
                <p style={{ fontFamily: "'IBM Plex Mono', monospace" }} className="text-sm shrink-0">{fmt(e.amount)} €</p>
                <button onClick={() => onDelete(e.id)} style={{ color: TEXT_MUTED, fontSize: 14 }} className="shrink-0">🗑️</button>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Savings({ goals, onAdd, onDelete, onContribute }) {
  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <p className="text-[11px] uppercase tracking-[0.15em]" style={{ color: ROSE }}>{goals.length} objectif{goals.length > 1 ? "s" : ""}</p>
        <button onClick={onAdd} className="flex items-center gap-1 text-xs px-3 py-1.5 rounded-full font-medium" style={{ backgroundColor: ROSE, color: "#FFFFFF" }}>+ Nouvel objectif</button>
      </div>
      {goals.length === 0 ? <EmptyState text="Crée un objectif d'épargne pour commencer à suivre tes progrès." /> : (
        <div className="space-y-4">{goals.map((g) => <GoalCard key={g.id} goal={g} onDelete={onDelete} onContribute={onContribute} />)}</div>
      )}
    </div>
  );
}

function GoalCard({ goal, onDelete, onContribute }) {
  const [amount, setAmount] = useState("");
  const pct = Math.min(100, (goal.current / goal.target) * 100 || 0);
  const ticks = 20;
  const filledTicks = Math.round((pct / 100) * ticks);
  const months = goal.deadline ? monthsUntil(goal.deadline) : null;
  const monthlyNeeded = months ? Math.max(0, goal.target - goal.current) / months : null;
  const deadlineLabel = goal.deadline ? new Date(goal.deadline).toLocaleDateString("fr-FR", { month: "long", year: "numeric" }) : null;
  return (
    <Card>
      <div className="flex items-start justify-between">
        <div className="flex items-center gap-2"><span style={{ fontSize: 16 }}>🎯</span><p style={{ fontFamily: "'Fraunces', serif" }} className="text-lg">{goal.name}</p></div>
        <button onClick={() => onDelete(goal.id)} style={{ color: TEXT_MUTED, fontSize: 14 }}>🗑️</button>
      </div>
      <div className="mt-4 flex gap-[3px] h-6 items-end">
        {Array.from({ length: ticks }).map((_, i) => <div key={i} className="flex-1 rounded-sm transition-all" style={{ height: i < filledTicks ? "100%" : "40%", backgroundColor: i < filledTicks ? ROSE : BORDER }} />)}
      </div>
      <div className="flex items-center justify-between mt-3">
        <p style={{ fontFamily: "'IBM Plex Mono', monospace" }} className="text-sm">{fmt(goal.current)} / {fmt(goal.target)} €</p>
        <p style={{ fontFamily: "'IBM Plex Mono', monospace", color: ROSE }} className="text-sm">{Math.round(pct)}%</p>
      </div>
      {monthlyNeeded !== null && <p className="text-[11px] mt-1.5" style={{ color: SAGE }}>≈ {fmt(monthlyNeeded)} €/mois pour l'atteindre d'ici {deadlineLabel}</p>}
      <div className="flex gap-2 mt-3">
        <input type="number" inputMode="decimal" placeholder="Montant" value={amount} onChange={(ev) => setAmount(ev.target.value)}
          className="flex-1 rounded-lg px-3 py-2 text-sm focus:outline-none" style={{ backgroundColor: BG, border: `1px solid ${BORDER}`, color: TEXT }} />
        <button onClick={() => { const n = Number(amount); if (n > 0) { onContribute(goal.id, n); setAmount(""); } }}
          className="px-3 py-2 rounded-lg text-sm font-medium shrink-0" style={{ backgroundColor: SAGE, color: "#FFFFFF" }}>Verser</button>
      </div>
    </Card>
  );
}

function StepIcon({ done }) {
  if (done) return <div style={{ width: 18, height: 18, borderRadius: "50%", backgroundColor: SAGE, color: "#fff", fontSize: 11, display: "flex", alignItems: "center", justifyContent: "center" }} className="shrink-0">✓</div>;
  return <div style={{ width: 18, height: 18, borderRadius: "50%", border: `1px solid ${BORDER}` }} className="shrink-0" />;
}

function Parcours({ data, onEditProfile, onExport, onImport }) {
  const hasIncome = data.income > 0;
  const hasCharges = data.charges.length > 0;
  const hasGoal = data.goals.length > 0;
  const hasContribution = data.goals.some((g) => g.current > 0);
  const weekStart = startOfWeek();
  const activeDaysThisWeek = new Set(data.expenses.filter((e) => inRange(e.date, weekStart)).map((e) => e.date)).size;
  const hasWeeklyTracking = activeDaysThisWeek > 0;
  const steps = [
    { label: "Revenu mensuel renseigné", done: hasIncome },
    { label: "Charges fixes définies", done: hasCharges },
    { label: "Un objectif d'épargne posé", done: hasGoal },
    { label: "Premier versement à l'épargne", done: hasContribution },
    { label: "Suivi de la semaine commencé", done: hasWeeklyTracking },
  ];
  const doneCount = steps.filter((s) => s.done).length;
  const pct = Math.round((doneCount / steps.length) * 100);
  let level = "Premiers pas";
  if (pct === 100) level = "Maîtrise du budget";
  else if (pct >= 80) level = "Presque au sommet";
  else if (pct >= 40) level = "Sur la bonne voie";
  else if (pct > 0) level = "En chemin";
  const reflection = pickByDay(REFLECTIONS);

  return (
    <div className="space-y-6">
      <ObjectiveBanner profile={data.profile} onEdit={onEditProfile} />
      <Card>
        <div className="flex items-center gap-2 mb-1"><span style={{ fontSize: 14 }}>✨</span><p className="text-xs" style={{ color: ROSE }}>{level}</p></div>
        <div className="flex items-end gap-4 mt-3">
          <p style={{ fontFamily: "'Fraunces', serif" }} className="text-4xl">{pct}%</p>
          <p className="text-xs mb-1.5" style={{ color: TEXT_MUTED }}>{doneCount} / {steps.length} étapes</p>
        </div>
        <div className="mt-3 h-2 rounded-full overflow-hidden" style={{ backgroundColor: BG }}><div className="h-full rounded-full transition-all" style={{ width: `${pct}%`, backgroundColor: ROSE }} /></div>
        <p className="text-xs mt-3" style={{ color: TEXT_MUTED }}>{activeDaysThisWeek} jour{activeDaysThisWeek > 1 ? "s" : ""} actif{activeDaysThisWeek > 1 ? "s" : ""} cette semaine</p>
      </Card>
      <div>
        <p className="text-[11px] uppercase tracking-[0.15em] mb-3" style={{ color: ROSE }}>Tes premiers pas</p>
        <div className="space-y-2">
          {steps.map((s, i) => (
            <div key={i} className="flex items-center gap-3 rounded-lg px-3 py-2.5 border" style={{ backgroundColor: SURFACE, borderColor: BORDER }}>
              <StepIcon done={s.done} /><span className="text-sm" style={{ color: s.done ? TEXT : TEXT_MUTED }}>{s.label}</span>
            </div>
          ))}
        </div>
      </div>
      <div className="rounded-xl p-4" style={{ backgroundColor: SURFACE_ALT, border: `1px solid ${BORDER}` }}>
        <p className="text-[11px] uppercase tracking-[0.15em] mb-1.5" style={{ color: ROSE }}>Question du jour</p>
        <p className="text-sm leading-relaxed">{reflection}</p>
      </div>
      <div className="rounded-xl p-4 flex gap-3" style={{ backgroundColor: SURFACE_ALT, border: `1px solid ${BORDER}` }}>
        <span style={{ fontSize: 18 }} className="shrink-0">🎉</span>
        <p className="text-xs leading-relaxed">Un budget sain garde de la place pour se faire plaisir. La catégorie « Loisirs & plaisir » n'est pas un excès à éviter, c'est une ligne à prévoir.</p>
      </div>
      <Card>
        <p className="text-[11px] uppercase tracking-[0.15em] mb-2" style={{ color: ROSE }}>Synchronisation</p>
        <p className="text-xs mb-3" style={{ color: TEXT_MUTED }}>
          Tes données sont sauvegardées automatiquement sur ton compte et disponibles sur tous tes appareils. Tu peux aussi garder une copie locale, au cas où.
        </p>
        <div className="flex gap-2">
          <button onClick={onExport} className="flex-1 py-2.5 rounded-lg text-sm font-medium" style={{ backgroundColor: ROSE, color: "#FFFFFF" }}>⬇️ Exporter</button>
          <button onClick={onImport} className="flex-1 py-2.5 rounded-lg text-sm font-medium border" style={{ borderColor: BORDER, color: TEXT }}>⬆️ Importer</button>
        </div>
      </Card>
      <TipCard />
    </div>
  );
}

function EmptyState({ text }) {
  return <div className="text-center py-12 rounded-xl border border-dashed" style={{ borderColor: BORDER }}><p className="text-sm px-6" style={{ color: TEXT_MUTED }}>{text}</p></div>;
}

function Sheet({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 bg-black/40 flex items-end z-50" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className="w-full rounded-t-2xl p-5 overflow-y-auto"
        style={{ backgroundColor: SURFACE, borderTop: `1px solid ${BORDER}`, maxHeight: "85vh", paddingBottom: "calc(2rem + env(safe-area-inset-bottom))" }}>
        <div className="flex items-center justify-between mb-5">
          <p style={{ fontFamily: "'Fraunces', serif" }} className="text-xl">{title}</p>
          <button onClick={onClose} style={{ color: TEXT_MUTED, fontSize: 20 }}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return <div className="mb-4"><label className="text-[11px] uppercase tracking-[0.15em] block mb-1.5" style={{ color: "#B97A8D" }}>{label}</label>{children}</div>;
}

const inputStyle = { backgroundColor: BG, border: `1px solid ${BORDER}`, color: TEXT };
const inputClass = "w-full rounded-lg px-3 py-2.5 text-sm focus:outline-none";

function CategoryPicker({ category, setCategory }) {
  return (
    <div className="grid grid-cols-3 gap-2">
      {CATEGORIES.map((c) => (
        <button key={c.id} onClick={() => setCategory(c.id)} className="flex flex-col items-center gap-1 py-2.5 rounded-lg border text-[10px] text-center leading-tight"
          style={{ borderColor: category === c.id ? c.color : BORDER, backgroundColor: category === c.id ? c.color + "1F" : "transparent", color: category === c.id ? TEXT : TEXT_MUTED }}>
          <span style={{ fontSize: 16 }}>{c.emoji}</span>{c.label}
        </button>
      ))}
    </div>
  );
}

function ExpenseForm({ onClose, onSubmit }) {
  const [category, setCategory] = useState(CATEGORIES[0].id);
  const [name, setName] = useState("");
  const [amount, setAmount] = useState("");
  const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
  return (
    <Sheet title="Ajouter une dépense variable" onClose={onClose}>
      <Field label="Catégorie"><CategoryPicker category={category} setCategory={setCategory} /></Field>
      <Field label="Description (optionnel)"><input className={inputClass} style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} placeholder="Ex : sortie, cadeau, imprévu…" /></Field>
      <Field label="Montant (€)"><input type="number" inputMode="decimal" className={inputClass} style={inputStyle} value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0" /></Field>
      <Field label="Date"><input type="date" className={inputClass} style={inputStyle} value={date} onChange={(e) => setDate(e.target.value)} /></Field>
      <button disabled={!amount || Number(amount) <= 0} onClick={() => onSubmit({ category, name, amount: Number(amount), date })}
        className="w-full py-3 rounded-lg font-medium text-sm disabled:opacity-40" style={{ backgroundColor: ROSE, color: "#FFFFFF" }}>Enregistrer →</button>
    </Sheet>
  );
}

function ChargeForm({ initial, onClose, onSubmit }) {
  const [category, setCategory] = useState(initial?.category || CATEGORIES[0].id);
  const [name, setName] = useState(initial?.name || "");
  const [amount, setAmount] = useState(initial?.amount ?? "");
  return (
    <Sheet title={initial ? "Modifier la charge" : "Ajouter une charge fixe"} onClose={onClose}>
      <Field label="Catégorie"><CategoryPicker category={category} setCategory={setCategory} /></Field>
      <Field label="Nom (optionnel)"><input className={inputClass} style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} placeholder="Ex : Loyer studio, Netflix, Forfait SFR…" /></Field>
      <Field label="Montant mensuel (€)"><input type="number" inputMode="decimal" className={inputClass} style={inputStyle} value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0" /></Field>
      <button disabled={!amount || Number(amount) <= 0} onClick={() => onSubmit({ id: initial?.id, category, name, amount: Number(amount) })}
        className="w-full py-3 rounded-lg font-medium text-sm disabled:opacity-40" style={{ backgroundColor: ROSE, color: "#FFFFFF" }}>
        {initial ? "Enregistrer les modifications" : "Ajouter la charge"} →
      </button>
    </Sheet>
  );
}

function GoalForm({ onClose, onSubmit }) {
  const [name, setName] = useState("");
  const [target, setTarget] = useState("");
  const [current, setCurrent] = useState("");
  const [deadline, setDeadline] = useState("");
  return (
    <Sheet title="Nouvel objectif d'épargne" onClose={onClose}>
      <Field label="Nom de l'objectif"><input className={inputClass} style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} placeholder="Ex : Installation à Valence" /></Field>
      <Field label="Montant cible (€)"><input type="number" inputMode="decimal" className={inputClass} style={inputStyle} value={target} onChange={(e) => setTarget(e.target.value)} placeholder="0" /></Field>
      <Field label="Déjà épargné (optionnel)"><input type="number" inputMode="decimal" className={inputClass} style={inputStyle} value={current} onChange={(e) => setCurrent(e.target.value)} placeholder="0" /></Field>
      <Field label="Date cible (optionnel)"><input type="date" className={inputClass} style={inputStyle} value={deadline} onChange={(e) => setDeadline(e.target.value)} /></Field>
      <button disabled={!name || !target || Number(target) <= 0} onClick={() => onSubmit({ name, target: Number(target), current: Number(current) || 0, deadline })}
        className="w-full py-3 rounded-lg font-medium text-sm disabled:opacity-40" style={{ backgroundColor: ROSE, color: "#FFFFFF" }}>Créer l'objectif →</button>
    </Sheet>
  );
}

function IncomeForm({ initial, onClose, onSubmit }) {
  const [val, setVal] = useState(initial || "");
  return (
    <Sheet title="Revenu mensuel" onClose={onClose}>
      <Field label="Montant (€)"><input type="number" inputMode="decimal" className={inputClass} style={inputStyle} value={val} onChange={(e) => setVal(e.target.value)} autoFocus /></Field>
      <button onClick={() => onSubmit(val)} className="w-full py-3 rounded-lg font-medium text-sm" style={{ backgroundColor: ROSE, color: "#FFFFFF" }}>Mettre à jour →</button>
    </Sheet>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
